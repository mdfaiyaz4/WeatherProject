<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; color: #333;
        }
        .container { width: 100%; max-width: 450px; }
        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px; padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        #city { font-size: 26px; font-weight: 600; margin-bottom: 10px; }
        #temp { font-size: 72px; font-weight: bold; color: #2a5298; }
        #desc { font-size: 20px; color: #666; text-transform: capitalize; }

        /* Sunny/Clear Weather */
body.sunny {
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
}

/* Cloudy Weather */
body.cloudy {
    background: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%);
}

/* Rainy Weather */
body.rainy {
    background: linear-gradient(135deg, #616161 0%, #9bc5c3 100%);
}

/* Night Time */
body.night {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
}

        /* ---------- CHATBOT UI ---------- */
        .chat-toggle {
            position: fixed; bottom: 25px; left: 25px;
            width: 60px; height: 60px; border-radius: 50%;
            background: #2a5298; color: white; font-size: 28px;
            border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .chat-toggle:hover { transform: scale(1.1); }
        .chat-popup {
            position: fixed; bottom: 100px; left: 25px;
            width: 320px; height: 420px; background: white;
            border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: none; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: #2a5298; color: white; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; font-size: 14px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .user-msg { background: #2a5298; color: white; padding: 10px; border-radius: 15px 15px 0 15px; align-self: flex-end; max-width: 80%; }
        .ai-msg { background: #f0f2f5; color: #333; padding: 10px; border-radius: 15px 15px 15px 0; align-self: flex-start; max-width: 80%; line-height: 1.5; }
        .chat-input { display: flex; border-top: 1px solid #eee; }
        .chat-input input { flex: 1; padding: 15px; border: none; outline: none; }
        .chat-input button { padding: 0 20px; border: none; background: #2a5298; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="weather-card">
        <div id="city">Searching...</div>
        <div id="temp">--°C</div>
        <div id="desc">Allow GPS access to see weather</div>
    </div>
</div>

<button class="chat-toggle" id="toggleBtn">💬</button>

<div class="chat-popup" id="chatPopup">
    <div class="chat-header">
        <span>Weather AI Helper</span>
        <button id="closeBtn" style="background:none; border:none; color:white; font-size: 24px; cursor:pointer;">×</button>
    </div>
    <div id="chatMessages" class="chat-messages">
        <div class="ai-msg">I'm ready! Once I have your weather, ask me for advice!</div>
    </div>
    <div class="chat-input">
        <input id="userInput" placeholder="Ask about today...">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script type="importmap">
  { "imports": { "@google/genai": "https://esm.run/@google/genai" } }
</script>

<script type="module">
    import { GoogleGenAI } from "@google/genai";

    
    const WEATHER_API_KEY = "8e7c638a707548de978170621251912"; 
    const GEMINI_API_KEY = "AIzaSyB8hHT5XgMYxiYHmi_e51qCJEPFKNBWDXc";   

    // Initialize 2025 Gemini Client
    const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
    let weatherContext = "No context available yet.";

    
    async function fetchWeather() {
        const descEl = document.getElementById('desc');
        
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude } = pos.coords;
            try {
                const url = `https://api.weatherapi.com/v1/current.json?key=${WEATHER_API_KEY}&q=${latitude},${longitude}`;
                const response = await fetch(url);
                const data = await response.json();

                // Update UI
                document.getElementById('city').innerText = data.location.name;
                document.getElementById('temp').innerText = `${Math.round(data.current.temp_c)}°C`;
                descEl.innerText = data.current.condition.text;

                // Set AI Context
                weatherContext = `The user is in ${data.location.name}. Current temp: ${data.current.temp_c}°C. Sky: ${data.current.condition.text}. Humidity: ${data.current.humidity}%. Feels like: ${data.current.feelslike_c}°C.`;
            } catch (err) {
                descEl.innerText = "Error: Check your Weather API Key.";
            }
        }, (err) => {
            descEl.innerText = "Location access denied.";
        });
        // Inside your fetchWeather() success function:
const condition = data.current.condition.text.toLowerCase();
const isDay = data.current.is_day; // WeatherAPI provides this (1 for day, 0 for night)

// Remove any existing weather classes first
document.body.classList.remove('sunny', 'cloudy', 'rainy', 'night');

// Apply the new class based on the condition
if (!isDay) {
    document.body.classList.add('night');
} else if (condition.includes('sun') || condition.includes('clear')) {
    document.body.classList.add('sunny');
} else if (condition.includes('cloud') || condition.includes('overcast')) {
    document.body.classList.add('cloudy');
} else if (condition.includes('rain') || condition.includes('drizzle')) {
    document.body.classList.add('rainy');
}
    }

   
    const chatPopup = document.getElementById('chatPopup');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    document.getElementById('toggleBtn').onclick = () => chatPopup.style.display = "flex";
    document.getElementById('closeBtn').onclick = () => chatPopup.style.display = "none";

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        // User Message
        chatMessages.innerHTML += `<div class="user-msg">${text}</div>`;
        userInput.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            
            const result = await ai.models.generateContent({
                model: "gemini-2.5-flash",
                contents: [{ 
                    role: "user", 
                    parts: [{ text: `Context: ${weatherContext}\n\nUser Question: ${text}` }] 
                }]
            });

            // ⚠️ ACCESSING RESPONSE: Use result.text directly (not a function)
            const responseText = result.text; 

            chatMessages.innerHTML += `<div class="ai-msg">${responseText}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch (error) {
            console.error("Gemini Details:", error);
            chatMessages.innerHTML += `<div class="ai-msg" style="color:red">Error: ${error.message}</div>`;
        }
    }

    document.getElementById('sendBtn').onclick = handleChat;
    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleChat(); });

    fetchWeather();
</script>

</body>
</html>
